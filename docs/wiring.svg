<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="700" fill="#222">People Counter: ESP32 + relay wiring</text>
  <text x="20" y="54" font-size="13" fill="#555">Relay on when the count reaches level 3 (set in the app). The PC app decides; the ESP32 just switches.</text>

  <!-- ESP32 board -->
  <rect x="40" y="80" width="170" height="260" rx="10" fill="#1f3a5f" stroke="#0f2238" stroke-width="2"/>
  <rect x="62" y="130" width="70" height="80" rx="4" fill="#c9ced6" stroke="#8a919c"/>
  <text x="97" y="166" font-size="14" text-anchor="middle" fill="#1f3a5f" font-weight="700">ESP32</text>
  <text x="97" y="184" font-size="9" text-anchor="middle" fill="#1f3a5f">WROOM-32</text>
  <rect x="107" y="334" width="36" height="18" rx="3" fill="#9aa3ad" stroke="#555"/>
  <text x="125" y="372" font-size="12" text-anchor="middle" fill="#555">USB cable → PC (runs the app)</text>

  <!-- pin labels -->
  <g font-size="12" fill="#fff" text-anchor="end">
    <text x="200" y="244">GPIO18</text>
    <text x="200" y="284">5V / VIN</text>
    <text x="200" y="314">GND</text>
  </g>

  <!-- Relay module -->
  <rect x="300" y="220" width="150" height="100" rx="6" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="375" y="262" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Relay module</text>
  <text x="375" y="280" font-size="11" fill="#e3f2fd" text-anchor="middle">5 V, 1 channel</text>
  <g font-size="10" fill="#fff"><text x="306" y="244">IN</text><text x="306" y="290">VCC</text><text x="306" y="314">GND</text></g>
  <line x1="210" y1="240" x2="300" y2="240" stroke="#6a1b9a" stroke-width="2"/>
  <line x1="210" y1="280" x2="300" y2="280" stroke="#d32f2f" stroke-width="2"/>
  <line x1="210" y1="310" x2="300" y2="310" stroke="#222" stroke-width="2"/>
  <g font-size="11" fill="#555">
    <text x="460" y="240">COM / NO → switches your siren, lamp, door lock…</text>
    <text x="460" y="256">(separate supply; mains wiring only if you know how)</text>
    <text x="460" y="290">Resets when the relay clicks? Feed relay VCC from a</text>
    <text x="460" y="306">separate 5 V supply, GND shared with the ESP32.</text>
  </g>
</svg>
